[package]
name = "vvk"
version = "0.1.3"
license = "MIT OR Apache-2.0"
authors = ["hypengw <hypengwip@gmail.com>"]

[lib]
name = "vvk"
module = "vvk"
archive = "vvk"

[usage]
public-include-directories = ["include"]

[dependencies.rstd-std]
version = "0.1.15"
pub = true

[dependencies.rstd-dlopn]
version = "0.1.15"
pub = true

[dependencies.rstd-log]
version = "0.1.15"

[external-dependencies.pkg-config]
x11 = { module = "x11", usage = "compile", condition = 'target.os == "linux"' }

[[test]]
name = "vvk-tests"
sources = [
  "tests/main.cpp",
  "tests/dispatch.cpp",
  "tests/format.cpp",
  "tests/matrix.cpp",
  "tests/memory.cpp",
  "tests/memory_import.cpp",
  "tests/memory_vulkan.cpp",
]

[dev-dependencies]
rstd-test = { version = "0.1.15" }
